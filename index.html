<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkeletonStyler Playground</title>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #334155;
        --text-light: #64748b;
        --editor-bg: #1e1e1e;
        --editor-text: #d4d4d4;
        --success: #10b981;
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* --- HEADER --- */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        height: 60px;
        padding: 0 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        z-index: 10;
      }
      h1 { margin: 0; font-size: 1.25rem; color: #0f172a; display: flex; align-items: center; gap: 8px;}
      .badge {
        font-size: 0.75rem; background: #e0f2fe; color: #0369a1;
        padding: 4px 8px; border-radius: 99px; font-weight: 600;
      }

      /* --- MAIN LAYOUT --- */
      main {
        display: flex;
        flex: 1;
        overflow: hidden; /* Prevent body scroll */
      }

      /* Left: Editor */
      .editor-pane {
        width: 45%;
        display: flex;
        flex-direction: column;
        background: var(--editor-bg);
        border-right: 1px solid #333;
      }

      .toolbar {
        height: 40px;
        background: #252526;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        border-bottom: 1px solid #333;
      }
      .toolbar span { color: #9ca3af; font-size: 0.8rem; }

      .btn-run {
        background: var(--success);
        color: white;
        border: none;
        padding: 6px 16px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: filter 0.2s;
      }
      .btn-run:hover { filter: brightness(1.1); }
      .btn-run:active { transform: translateY(1px); }

      textarea#code-input {
        flex: 1;
        background: var(--editor-bg);
        color: var(--editor-text);
        border: none;
        padding: 1rem;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
        outline: none;
        white-space: pre;
      }

      /* Right: Preview */
      .preview-pane {
        width: 55%;
        display: flex;
        flex-direction: column;
        background: #fff;
        position: relative;
      }

      .pane-header {
        padding: 0.5rem 1rem;
        background: #f8fafc;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--text-light);
        display: flex;
        justify-content: space-between;
      }

      #app-preview {
        padding: 2rem;
        flex: 1;
        overflow: auto;
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
      }

      #error-log {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        color: #ef4444;
        font-family: monospace;
        padding: 1rem;
        background: #fef2f2;
        border-top: 1px solid #fee2e2;
        display: none;
        font-size: 0.875rem;
        max-height: 150px;
        overflow: auto;
        box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      /* --- BOTTOM: API DOCS --- */
      .api-docs {
        height: 35vh; /* Chiếm 35% chiều cao */
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }

      .docs-title {
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--border);
        background: #f8fafc;
        display: flex;
        justify-content: space-between;
      }

      .docs-grid {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .doc-column {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        border-right: 1px solid var(--border);
      }
      .doc-column:last-child { border-right: none; }

      .doc-col-header {
        position: sticky;
        top: 0;
        background: rgba(255,255,255,0.95);
        padding: 0.75rem 1rem;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-light);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(4px);
        z-index: 5;
      }

      .method-list {
        padding: 0.5rem 0;
      }

      .method-item {
        font-family: "Consolas", monospace;
        padding: 0.4rem 1rem;
        cursor: pointer;
        color: #0d9488; /* Teal color */
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .method-item:hover {
        background-color: #f0f9ff;
        color: var(--primary);
      }
      .method-item .args { color: #94a3b8; font-size: 0.8em; }
      .copy-icon { opacity: 0; font-size: 0.75rem; color: var(--text-light); }
      .method-item:hover .copy-icon { opacity: 1; }

      /* Toast Notification */
      #toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #333;
        color: #fff;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        font-size: 0.9rem;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      #toast.show { opacity: 1; transform: translateY(0); }

    </style>
  </head>
  <body>
    <header>
      <h1>🦴 SkeletonStyler <span class="badge" style="margin-left: 10px">v1.0</span></h1>
      <div style="font-size: 0.875rem; color: var(--text-light)">
        API & Playground
      </div>
    </header>

    <main>
      <div class="editor-pane">
        <div class="toolbar">
          <span>Input Code</span>
          <button class="btn-run" onclick="runCode()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            RUN CODE
          </button>
        </div>
        <textarea id="code-input" spellcheck="false">
new ElementBuilder()
  .s_flex()
  .s_gap("16px")
  .append(
     new ElementBuilder().s_w(60).s_h(60).s_roundedFull().markAsSkeleton(),
     new ElementBuilder().s_flex1().s_flexColumn().s_gap(8).append(
        new ElementBuilder().s_w("80%").s_h(20).markAsSkeleton(),
        new ElementBuilder().s_w("50%").s_h(15).markAsSkeleton()
     )
  )</textarea>
      </div>

      <div class="preview-pane">
        <div class="pane-header">
          Preview
          <span style="font-weight: normal; font-size: 0.75rem">Viewport: Responsive</span>
        </div>
        <div id="app-preview"></div>
        <div id="error-log"></div>
      </div>
    </main>

    <div class="api-docs">
      <div class="docs-title">
        <span>API Reference</span>
        <span style="font-weight: 400; font-size: 0.8rem; color: #64748b">Click to copy function signature</span>
      </div>
      <div class="docs-grid">
        <div class="doc-column">
          <div class="doc-col-header">🎨 Style Methods (.s_*)</div>
          <div class="method-list" id="style-methods"></div>
        </div>
        <div class="doc-column">
          <div class="doc-col-header">🏗️ Builder Methods</div>
          <div class="method-list" id="builder-methods"></div>
        </div>
        <div class="doc-column">
          <div class="doc-col-header">⚙️ Static / Config</div>
          <div class="method-list" id="static-methods"></div>
        </div>
      </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script src="./dist/index.umd.js"></script>

    <script>
      // 1. SETUP
      // Chú ý: Ở file UMD, mọi thứ nằm trong window.SkeletonStyler
      const Lib = window.SkeletonStyler;
      const { ElementBuilder, SkeletonAnimation, StyleBuilder } = Lib;

      const inputEl = document.getElementById("code-input");
      const previewEl = document.getElementById("app-preview");
      const errorEl = document.getElementById("error-log");
      const toastEl = document.getElementById("toast");

      // 2. DOCUMENTATION GENERATOR (FIXED)
      function generateDocs() {
        const styleList = document.getElementById("style-methods");
        const builderList = document.getElementById("builder-methods");
        const staticList = document.getElementById("static-methods");

        // Helper: Duyệt Prototype Chain (cho các hàm như generate, getElement)
        const getProtoMethods = (obj) => {
            let props = new Set();
            let currentObj = obj;
            while (currentObj && currentObj !== Object.prototype) {
                Object.getOwnPropertyNames(currentObj).map(item => props.add(item));
                currentObj = Object.getPrototypeOf(currentObj);
            }
            return [...props];
        };

        // --- FIX QUAN TRỌNG ---
        // Vì bản build dùng Class Properties (s_flex = () => ...), các hàm s_ không nằm trong prototype.
        // Ta phải tạo 1 instance giả để quét các key của nó.
        const dummyInstance = new ElementBuilder();
        const instanceKeys = Object.keys(dummyInstance); // Quét các hàm s_...
        const protoKeys = getProtoMethods(ElementBuilder.prototype); // Quét generate, getElement...

        // Gộp lại và loại bỏ trùng lặp
        const allMethods = [...new Set([...instanceKeys, ...protoKeys])];

        // Filter: Style Methods (s_*)
        const styleMethods = allMethods.filter(m => m.startsWith('s_'));

        // Filter: Builder Methods (không phải s_, không phải private _, không phải constructor)
        const builderMethods = allMethods.filter(m =>
            !m.startsWith('s_') &&
            !m.startsWith('_') &&
            m !== 'constructor' &&
            // Kiểm tra xem nó có phải là function không (trên instance hoặc prototype)
            (typeof dummyInstance[m] === 'function' || typeof ElementBuilder.prototype[m] === 'function')
        );

        // Filter: Static Methods (trực tiếp trên class ElementBuilder)
        const staticMethods = Object.getOwnPropertyNames(ElementBuilder).filter(m =>
            typeof ElementBuilder[m] === 'function' &&
            !['length', 'name', 'prototype', 'fromJSON'].includes(m)
        );

        // Render Helper
        const renderItem = (name, container, isStatic = false) => {
            let args = "()";
            try {
                // Lấy function thực tế để parse arguments
                const func = isStatic ? ElementBuilder[name] : dummyInstance[name];

                if (func) {
                    const str = func.toString();
                    // Basic argument parsing
                    const argMatch = str.slice(str.indexOf('('), str.indexOf(')') + 1);
                    if (argMatch) args = argMatch;

                    // Nếu bị minify thành a(b), argMatch sẽ ngắn.
                    // Nếu là arrow function s_w = (v) => ..., toString() sẽ trả về (v) => ...
                    if (!str.startsWith('function') && !str.startsWith(name)) {
                         // Xử lý arrow function
                         const arrowArgs = str.split('=>')[0].trim();
                         if(arrowArgs) args = arrowArgs.startsWith('(') ? arrowArgs : `(${arrowArgs})`;
                    }
                }
            } catch(e) {}

            const textToCopy = isStatic ? `ElementBuilder.${name}${args}` : `.${name}${args}`;
            const div = document.createElement("div");
            div.className = "method-item";
            div.onclick = () => copyToClipboard(textToCopy);
            div.innerHTML = `
                <span>${isStatic ? 'ElementBuilder.' : '.'}${name}<span class="args">${args}</span></span>
                <span class="copy-icon">📋</span>
            `;
            container.appendChild(div);
        };

        styleMethods.sort().forEach(m => renderItem(m, styleList));
        builderMethods.sort().forEach(m => renderItem(m, builderList));
        staticMethods.sort().forEach(m => renderItem(m, staticList, true));
      }

      // 3. COPY FUNCTION
      function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(`Copied: ${text}`);
        });
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 2000);
      }

      // 4. RUN CODE LOGIC
      function runCode() {
        const code = inputEl.value.trim();
        if (!code) return;

        errorEl.style.display = "none";
        previewEl.innerHTML = ""; // Clear old

        try {
            let resultElement;

            // Hack nhẹ: Để user có thể dùng các biến global trong khung editor mà ko cần khai báo lại
            // Ta tạo một function wrapper
            const runUserCode = new Function(
                "ElementBuilder", "SkeletonAnimation", "StyleBuilder",
                `return (function() {
                    // Support shorthand: nếu dòng đầu bắt đầu bằng . thì thêm new ElementBuilder().markAsSkeleton()
                    ${code.startsWith('.') ? 'return new ElementBuilder().markAsSkeleton()' + code : 'return ' + code}
                 })()`
            );

            const evalResult = runUserCode(ElementBuilder, SkeletonAnimation, StyleBuilder);

            if (evalResult instanceof HTMLElement) {
                resultElement = evalResult;
            } else if (evalResult && typeof evalResult.generate === 'function') {
                resultElement = evalResult.generate();
            }

            if (resultElement) {
                previewEl.appendChild(resultElement);
            } else {
                // Trường hợp code chạy ok nhưng ko return element (ví dụ set config)
                // console.log("Code executed.");
            }

        } catch (err) {
            errorEl.style.display = "block";
            errorEl.textContent = `Runtime Error: ${err.message}`;
            console.error(err);
        }
      }

      // INIT
      generateDocs();
      runCode(); // Chạy lần đầu

    </script>
  </body>
</html>
